# ============================================================================
# 扫码点餐管理系统 - Nginx 成品配置（可直接部署）
#
# 服务器落位: /etc/nginx/conf.d/dining-system.conf
#
# 【部署前只需改 2 处占位符】
#   1. server_name  → 换成你的域名或公网 IP（全文件共 2 处：HTTP 与 HTTPS 各 1 处）
#   2. ssl_certificate / ssl_certificate_key → 换成你证书的真实路径（启用 HTTPS 时）
#
# 【两种用法二选一】
#   A. 暂未备案 / 无证书 → 直接用下方 80 端口 server（HTTPS 段保持注释）即可上线
#   B. 已有证书         → 取消 HTTPS 段注释，并取消 80 端口里的 "return 301" 注释
#
# 校验与生效: nginx -t && nginx -s reload
# ============================================================================

# 登录限流(防暴力破解): 按来源 IP 计数, rate=5r/m 每分钟 5 次, burst 突发最多 5 次。
# zone 定义位于 http 上下文, 放在 conf.d 配置文件顶部即可生效。
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# 上游后端服务(Go Gin)
upstream dining_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ============================================================================
# HTTP (80) —— 默认启用, 可直接对外服务
# ============================================================================
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;   # ← 改这里: 域名或公网 IP

    # 启用 HTTPS 后, 取消下面这行注释, 将 HTTP 强制跳转到 HTTPS
    # return 301 https://$host$request_uri;

    # ---------- 安全响应头 ----------
    # CSP: 默认同源; 脚本仅同源; 样式允许内联(TDesign 依赖); 图片允许 data/blob。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 前端静态托管 ----------
    root /opt/dining-system/frontend/dist;
    index index.html;

    # 上传限制(与后端 5MB 限制对齐, 留出富余)
    client_max_body_size 8m;

    access_log /var/log/nginx/dining-access.log;
    error_log  /var/log/nginx/dining-error.log;

    # ---------- 前端 SPA(Vue Router history 模式回退) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存(带 hash 的构建产物)
    location /static/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 登录接口限流(与后端内存级限流叠加, nginx 重启不清零) ----------
    location = /prod-api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 后端 API ----------
    location /prod-api/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 上传图片(由后端静态托管) ----------
    location /uploads/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /picture/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 基础压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_vary on;
}

