# ============================================================================
# 扫码点餐管理系统 - Nginx 生产配置模板（默认生产 IP: 111.230.154.50）
#
# 服务器落位: /etc/nginx/conf.d/dining-system.conf
#
# 【推荐】全自动生成(在目标服务器上以 root 执行, 脚本会自动替换/备份/校验/回滚/重载):
#   sudo bash deploy/setup-nginx.sh                        # 纯 IP 模式(默认 server_name=111.230.154.50)
#   sudo bash deploy/setup-nginx.sh --ip 111.230.154.50     # 显式指定公网 IP
#   sudo bash deploy/setup-nginx.sh --domain dining.com \
#        --cert /etc/nginx/ssl/dining.crt --key /etc/nginx/ssl/dining.key   # 域名 + HTTPS(自动开 80→443 跳转)
#   sudo bash deploy/setup-nginx.sh --dry-run              # 只生成并校验, 不落盘、不重载
#
# 【手动】直接拷贝使用(默认即为纯 IP 访问 80 端口):
#   sudo cp deploy/nginx-production.conf /etc/nginx/conf.d/dining-system.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 【切换到 HTTPS 只需两处开关】(setup-nginx.sh --domain 会自动完成)
#   1. 取消 "HTTPS_BLOCK_BEGIN → HTTPS_BLOCK_END" 之间的整块注释, server_name 换成域名;
#   2. 取消 80 端口 server 内 "REDIRECT_BEGIN → REDIRECT_END" 之间的跳转注释。
#
# 校验与生效: nginx -t && nginx -s reload
# ============================================================================

# 登录限流(防暴力破解): 按来源 IP 计数, rate=5r/m 每分钟 5 次, burst 突发最多 5 次。
# zone 定义位于 http 上下文, 放在 conf.d 配置文件顶部即可生效。
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# 触发限流时返回 429(默认 503), 语义更清晰, 便于前端区分"被限流"与"服务不可用"。
limit_req_status 429;

# 上游后端服务(Go Gin)
upstream dining_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ============================================================================
# HTTP (80) —— 默认启用, 可直接对外服务
# ============================================================================
server {
    listen 80;
    server_name 111.230.154.50;   # ← 用 --ip / --domain 生成时自动替换

    # 用 --domain 启用 HTTPS 后, 下面这行会被自动取消注释(将 HTTP 强制跳转到 HTTPS)
    # REDIRECT_BEGIN
    # return 301 https://$host$request_uri;
    # REDIRECT_END

    # 隐藏 Nginx 版本号, 收敛指纹暴露面
    server_tokens off;

    # ---------- 安全响应头 ----------
    # CSP: 默认同源; 脚本仅同源; 样式允许内联(TDesign 依赖); 图片允许 data/blob。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 前端静态托管 ----------
    root /opt/dining-system/frontend/dist;
    index index.html;

    # 上传限制(与后端 5MB 限制对齐, 留出富余)
    client_max_body_size 8m;

    access_log /var/log/nginx/dining-access.log;
    error_log  /var/log/nginx/dining-error.log;

    # ---------- 前端 SPA(Vue Router history 模式回退) ----------
    # 入口 index.html 不带内容 hash,必须每次回源校验,否则发版后浏览器
    # (尤其微信内置浏览器)会继续用缓存的旧入口,引用到已被删除的旧 JS,
    # 表现为「部署了但页面没变」甚至白屏。try_files 回退 / 访问根路径 / 直接
    # 请求 /index.html 都会内部重定向到这里,故只需精确匹配一个 location。
    # 这里用 expires -1(等价于 Cache-Control: no-cache)而不是 add_header:
    # add_header 一旦出现在 location 层,就会覆盖 server 层的安全响应头。
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存(带 hash 的构建产物)
    location /static/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 登录接口限流(与后端内存级限流叠加, nginx 重启不清零) ----------
    # 注意: 反代后后端拿到的对端 IP 是 127.0.0.1, 须在 systemd 服务里配置
    #       Environment=TRUSTED_PROXIES=127.0.0.1, 后端才会信任 X-Real-IP,
    #       否则后端自身的登录限流会把所有客户端算作同一个 IP。
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 上传图片(由后端静态托管) ----------
    location /uploads/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 基础压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_vary on;
}

