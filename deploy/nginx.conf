# ============================================================================
# 扫码点餐管理系统 - Nginx 配置（前端静态托管 + 后端反向代理）
#
# 用途:
#   1. 托管前端构建产物 (frontend/dist), 支持 Vue Router history 模式的 SPA 回退
#   2. 将 /prod-api 反代到 Go 后端 (127.0.0.1:8080)
#   3. 将 /uploads 反代到 Go 后端 (后端负责提供上传图片)
#
# 部署步骤见 deploy/deploy.sh, 或将本文件放入
#   /etc/nginx/conf.d/dining-system.conf 后执行 nginx -t && nginx -s reload
# ============================================================================

# 登录限流(防暴力破解):按来源 IP 计数,5r/m=每分钟 5 次,突发最多 5 次。
# zone 定义位于 http 上下文,conf.d 目录下的配置文件顶部即可生效。
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# 上游后端服务(Go Gin)
upstream dining_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    # 正式部署请替换为你的域名/IP
    server_name _;

    # ---------- 安全响应头 ----------
    # CSP: 默认同源;脚本仅同源;样式允许内联(TDesign 依赖);图片允许 data/blob。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端构建产物根目录(与 deploy.sh 中 FRONTEND_DIST 保持一致)
    root /opt/dining-system/frontend/dist;
    index index.html;

    # 上传限制(与后端 5MB 限制对齐, 留出富余)
    client_max_body_size 8m;

    # 访问日志(按需开启)
    access_log /var/log/nginx/dining-access.log;
    error_log  /var/log/nginx/dining-error.log;

    # ---------- 前端 SPA ----------
    # 先尝试匹配静态文件, 否则回退到 index.html 交由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存(带 hash 的构建产物)
    location /static/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 登录接口限流(与后端内存级限流叠加,基于 nginx 重启不清零) ----------
    location = /prod-api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 管理端接口 IP 白名单(可选,按需启用) ----------
    # 注意:启用后移动 4G/宽带出口 IP 会变,可能把自己锁在门外,建议配合固定管理 IP 或 VPN。
    # 示例(仅允许办公网段访问管理接口,含登录):
    # location /prod-api/ {
    #     allow 203.0.113.0/24;   # 替换为你的管理网段
    #     deny  all;
    #     proxy_pass http://dining_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection "";
    # }

    # ---------- 后端 API ----------
    location /prod-api/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 上传图片(由后端静态托管, 也可改为 Nginx 直接读 UPLOAD_DIR) ----------
    location /uploads/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /picture/ {
        proxy_pass http://dining_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 基础压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_vary on;
}

# ============================================================================
