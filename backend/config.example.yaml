# ============================================================================
# 点餐管理系统 — 后端部署配置「全量注释模板」（config.example.yaml）
# ----------------------------------------------------------------------------
# 定位：本文件是**教学/参考**模板（入库公开），列出全部可配项与逐项说明；
#       想要一份「值已填好、可直接用」的生产配置，请复制成 config.prod.yaml
#       （该文件不入库、可写真实密码；make build 会把它复制成 bin/config.yaml，
#        deploy.sh 也优先以它为模板生成服务器上的 config.yaml）。
#
# 用法：复制为 backend/config.yaml，按需取消注释并修改。
#       cp config.example.yaml config.yaml
#   · 用 deploy/deploy.sh 部署到服务器时无需手工复制：首次安装会自动生成
#     <INSTALL_DIR>/config.yaml(并校正 database / admin / trusted_proxies 等),
#     之后每次带 DB_* 部署只会重写其中的 database 段，其余内容保留。
#
# 【优先级】真实环境变量 > config.yaml > .env > 代码默认值
#   · 三者可以共存，也可以只用其中一个；同键时按上面的顺序取高优先级；
#   · 真实环境变量（systemd Environment= / docker -e / 命令行）永远最高，
#     便于临时覆盖而不用改文件；
#   · 任何一项都不配也能启动：默认 SQLite + 8080 端口 + admin/admin123。
#
# 【文件位置】程序读取「当前工作目录」下的 config.yaml。
#   · 从 backend/ 启动            → backend/config.yaml
#   · 用 SYSTEMd/服务方式部署      → 请在工作目录下放文件，或用 CONFIG_FILE 指定绝对路径
#   · 想换成别的路径/文件名        → 设置环境变量 CONFIG_FILE=/opt/dining/config.yaml
#
# 【未知键会报错】为防拼错，出现本模板之外的键名时会直接启动失败并提示行号，
#   这是有意为之——静默忽略拼错的键名会让排查变得非常困难。
#
# 【安全】本文件会包含数据库密码，请与同目录的 .env 一样加进 .gitignore，
#   不要提交到代码仓库。
#
# 完整迁移手册见 ../docs/mysql-migration.md
#
# 【日志】zap 结构化日志,控制台可读 + 文件 JSON 可采集,配置见下方 log 段。
#   等价环境变量: LOG_PATH / LOG_AGENT_PATH / LOG_LEVEL / LOG_MAX_SIZE_MB /
#   LOG_MAX_AGE_DAYS / LOG_MAX_BACKUPS(两者可混用, 环境变量优先级更高); 默认
#   落盘 ./logs/app.log。生产用 deploy.sh 部署时会自动写入 <INSTALL_DIR>/logs/app.log。
# ============================================================================

# ---------------------------------------------------------------------------
# HTTP 服务与静态资源
# ---------------------------------------------------------------------------
server:
  # 监听端口（默认 8080）
  port: 8080
  # 旧版本升级时的存量图片导入源目录（启动自动导入数据库后不再使用；运行时图片存储于数据库）（默认 ./uploads）
  # upload_dir: ./uploads
  # 前端构建产物目录（默认 ../frontend/dist）
  # static_dir: ../frontend/dist
  # 跨域白名单；默认不放开跨域（前后端同源部署无需配置）
  # 仅当 H5 点餐页部署在其它域名时才需要填写
  # cors_origins:
  #   - https://order.example.com
  # 可信代理 IP/CIDR；经 Nginx 反代时必须配置，
  # 否则登录限流取不到真实客户端 IP（会退化成全局粒度）
  # trusted_proxies:
  #   - 127.0.0.1
  # 雪花算法节点号（0~1023），requestID 生成器使用（默认 1）；
  # 单实例部署无需配置；多实例部署时每个实例必须不同，否则可能生成重复 requestID
  # snowflake_node_id: 1

# ---------------------------------------------------------------------------
# 数据库后端
# ---------------------------------------------------------------------------
database:
  # sqlite（默认，零依赖单机） | mysql
  # 不填时：若下面 mysql 段填了 dsn，则按 mysql 处理，否则按 sqlite。
  driver: sqlite

  # ---- SQLite（默认） ----
  sqlite:
    # 数据文件路径（默认 ./data/dining.db）
    path: ./data/dining.db

  # ---- MySQL（driver 设为 mysql 时生效） ----
  mysql:
    # 方式 A（推荐）：完整 DSN，非空时优先于下面的分项配置
    # dsn: root:密码@tcp(127.0.0.1:3306)/dining?charset=utf8mb4&parseTime=true&loc=Local&maxAllowedPacket=134217728
    # 方式 B：分项配置，程序自动拼接 DSN
    # host: 127.0.0.1
    # port: 3306
    # user: root
    # password: ""
    # name: dining
    # 附加参数，loc=Local 保证写入的时间字符串是本地时间，maxAllowedPacket 放行 64MB 图片写入
    # params: charset=utf8mb4&parseTime=true&loc=Local&maxAllowedPacket=134217728

# ---------------------------------------------------------------------------
# 敏感配置加密与登录令牌
# ---------------------------------------------------------------------------
security:
  # AES-256-GCM 主密钥，用于加密 tb_config 中的敏感项（如微信支付 APIv3 密钥）。
  # 取值优先级：本项 > MASTER_KEY_PATH 文件 > ./data/master.key（不存在则自动生成）。
  # ⚠️ 迁移数据库时必须把原 data/master.key 一并带走，否则已加密的密钥无法解密。
  # 支持格式：原始 32 字符 / 64 位十六进制 / base64。留空即用文件方式。
  # master_key: ""
  # master_key_path: ./data/master.key
  # 主密钥轮换：换了新主密钥（或新环境自动生成了新密钥）而库里还是旧密钥加密的
  # 密文时，在这里声明旧密钥——启动时会自动把敏感配置改写为新密钥加密。
  # 格式与 master_key 相同；轮换完成后请删除本项，避免旧密钥长期留存。
  # master_key_old: ""
  # 管理端登录令牌有效期，单位小时（默认 24）
  # token_ttl_hours: 24
  # 是否收紧主密钥文件 ACL（Windows 下仅保留当前用户；非 Windows 忽略）
  # harden_file_acl: false

# ---------------------------------------------------------------------------
# 日志（落盘与轮转）
# ---------------------------------------------------------------------------
log:
  # 日志文件路径（默认 ./logs/app.log，相对启动时的工作目录）
  # 设为 off / none / false / 0 / - 表示不落盘，只输出到控制台
  # path: /opt/dining-system/logs/app.log
  # 门店打印代理（取单程序）的 pull/ping/ack 高频日志单独落盘，不混进主日志
  # agent_path: /opt/dining-system/logs/agent.log
  # 级别：debug / info / warn / error（默认 info）
  # level: info
  # 轮转：单文件上限 50MB / 保留 30 天 / 最多 7 份（旧文件自动压缩）
  # max_size_mb: 50
  # max_age_days: 30
  # max_backups: 7

# ---------------------------------------------------------------------------
# 站点访问统计（PV / UV / 新访客 / 渠道构成）
#
# 管理端「数据报表 → 访问趋势」与管理首页「今日访问」卡片的数据源。
# 口径：PV = 一次扫码/小程序冷启动/后台登录；UV 按访客去重——登录会员按
# customer_id 精确去重，匿名访客按前端随机访客 ID（换设备/换网络算新访客，
# 因此是近似值，看趋势即可）。IP/UA 只存哈希，不落明文。
# 详见 docs/design-docs/visit-analytics/spec.md。
# ---------------------------------------------------------------------------
visit:
  # 总开关（默认开）；关闭后打点接口直接返回成功、不落库
  # enabled: true
  # 访问明细保留天数（默认 90；0 = 永不清理）。日聚合台账不受影响、长期保留
  # retention_days: 90
  # 单 IP 每分钟打点上限（默认 60），防刷
  # rate_per_min: 60

# ---------------------------------------------------------------------------
# 管理端初始账号
# ---------------------------------------------------------------------------
admin:
  # 仅首次建库时写入；之后改密码请用系统内「修改密码」功能
  # user: admin
  # pass: admin123
